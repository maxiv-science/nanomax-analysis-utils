[project]
name = "nmutils"
version = "0.1.0"
description = "Shared library for nanomax-analysis-utils"
requires-python = ">=3.12"
dependencies = [
    "cython>=3.2.4",
    "h5py>=3.15.1",
    "hdf5plugin>=6.0.0",
    "looseversion>=1.3.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pooch>=1.9.0",
    "pyqt5>=5.15.11",
    "qtconsole>=5.7.1",
    "scipy>=1.17.0",
    "silx>=2.2.2",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

